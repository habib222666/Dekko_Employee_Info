<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE TEST - Employee App</title>
<link rel="stylesheet" href="style.css?v=20261007">
</head>

<body>

<div id="listPage">

<button id="adminButton">Admin</button>

<div id="appTitle">
    <div>Dekko Employee</div>
    <div>Information</div>
</div>

<div id="departmentSection">
    <div id="departmentHeader">
        <button id="allDepartmentsButton"><span class="dashboard-icon">🏢</span><span class="dashboard-label">All Departments</span></button>
        <button id="allEmployeesButton"><span class="dashboard-icon">👥</span><span class="dashboard-label">All Employees</span></button>
        <button id="favoriteEmployeesButton"><span class="dashboard-icon">❤️</span><span class="dashboard-label">Favorite Employees</span></button>
        <button id="birthdayButton"><span class="dashboard-icon">🎂</span><span class="dashboard-label">Birthday</span></button>
    </div>
</div>

</div>

<div id="allEmployeesPage" style="display:none;">
    <button id="allEmployeesBackButton">← Back</button>
    <h1>👥 All Employees</h1>

    <div class="searchBox">
        <input type="text" id="searchInput" placeholder="Search employee...">
        <button id="clearSearch">Clear</button>
    </div>

    <div id="designationFilterBox">
        <select id="designationFilter">
            <option value="">All Designations</option>
        </select>
    </div>

    <div id="resultCount">Loading...</div>

    <div id="employeeList"></div>
</div>

<div id="departmentPage" style="display:none;">
    <button id="departmentBackButton">← Back to Departments</button>
    <h1 id="departmentPageTitle">🏢 All Departments</h1>
    <div id="departmentCards"></div>
    <div id="departmentEmployeeList"></div>
</div>

<div id="favoritePage" style="display:none;">
    <button id="favoriteBackButton">← Back</button>
    <h1>❤️ Favorite Employees</h1>
    <div id="favoriteEmployeeList"></div>
</div>

<div id="birthdayPage" style="display:none;">
<button id="birthdayBackButton">← Back</button>
<h1>🎂 Birthday</h1>

<div id="birthdayMonths">
    <button data-month="1">January</button>
    <button data-month="2">February</button>
    <button data-month="3">March</button>
    <button data-month="4">April</button>
    <button data-month="5">May</button>
    <button data-month="6">June</button>
    <button data-month="7">July</button>
    <button data-month="8">August</button>
    <button data-month="9">September</button>
    <button data-month="10">October</button>
    <button data-month="11">November</button>
    <button data-month="12">December</button>
</div>

<div id="birthdayEmployeeList"></div>
</div>

<div id="detailsPage" style="display:none;">
<button id="backButton">← Back</button>
<h1>Employee Details</h1>
<div id="employeeDetails"></div>
</div>

<div id="loginPage" style="display:none;">
<button id="loginBackButton">← Back</button>
<h1>Admin Login</h1>

<div class="admin-card">

<label>Email</label>
<input type="email" id="adminEmail" placeholder="Admin email">

<label>Password</label>
<input type="password" id="adminPassword" placeholder="Password">

<button id="loginButton">Login</button>
<button id="forgotPasswordButton" type="button">Forgot Password?</button>

<div id="loginStatus"></div>

</div>
</div>

<div id="resetPasswordPage" style="display:none;">
<button id="resetBackButton">← Back</button>
<h1>Reset Password</h1>

<div class="admin-card">

<label>New Password</label>
<input type="password" id="newPassword" placeholder="New password">

<label>Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Confirm password">

<button id="updatePasswordButton">Update Password</button>

<div id="resetStatus"></div>

</div>
</div>

<div id="adminPage" style="display:none;">

<button id="adminBackButton">← Back</button>

<h1>Admin</h1>
<button id="createUserButton" style="display:block !important;width:100%;background:#2563eb !important;color:white !important;">Create New User</button>

<button id="logoutButton">Logout</button>

<div class="admin-card">

<h2>Employee Photo Upload</h2>

<label>Select Employee</label>

<select id="employeeSelect">
<option value="">Select employee</option>
</select>

<label>Select Photo</label>

<input type="file" id="photoInput" accept="image/*">

<button id="uploadPhotoButton">Upload Photo</button>

<div id="uploadStatus"></div>

</div>

<div class="admin-card">

<h2>Add New Employee</h2>

<button id="showAddEmployeeButton"
        type="button"
        style="display:block !important;width:100%;background:#16a34a !important;color:white !important;">
    + Add New Employee
</button>

<div id="addEmployeeForm"
     style="display:none;margin-top:20px;">

<label>Employee Name</label>
<input type="text" id="newEmployeeName" placeholder="Md. Habibur Rahman">

<label>Designation</label>
<input type="text" id="newEmployeeDesignation" placeholder="Asst. Manager">

<label>Company</label>
<input type="text" id="newEmployeeCompany" placeholder="Dekko Accessories Ltd.">

<label>Employee ID</label>
<input type="text" id="newEmployeeNo" placeholder="Employee ID">

<label>Department</label>
<input type="text" id="newEmployeeDepartment" placeholder="Department">

<label>Official No.</label>
<input type="text" id="newEmployeeOfficialNo" placeholder="Official No.">

<label>Personal No.</label>
<input type="text" id="newEmployeePersonalNo" placeholder="Personal No.">

<label>Email Address</label>
<input type="email" id="newEmployeeEmail" placeholder="Email Address">

<label>PABX No.</label>
<input type="text" id="newEmployeePabx" placeholder="PABX No.">

<label>Blood Group</label>
<input type="text" id="newEmployeeBloodGroup" placeholder="Blood Group">

<label>Joining Date</label>
<input type="date" id="newEmployeeJoiningDate">

<label>Date of Birth</label>
<input type="text" id="newEmployeeBirthday" placeholder="DD-MM">

<label>NID No.</label>
<input type="text" id="newEmployeeNid" placeholder="NID No.">

<label>TIN No.</label>
<input type="text" id="newEmployeeTin" placeholder="TIN No.">

<button id="saveNewEmployeeButton"
        type="button"
        style="display:block !important;width:100%;background:#2563eb !important;color:white !important;margin-top:20px;">
    Save Employee
</button>

<div id="addEmployeeStatus"
     style="margin-top:12px;"></div>

</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="app.js?v=20261008"></script>

</body>
</html>
